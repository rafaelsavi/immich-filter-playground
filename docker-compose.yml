services:
  immich-filter-playground:
    # image: ghcr.io/rafaelsavi/immich-filter-playground:latest
    build: .
    container_name: immich-filter-playground
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # Immich Server Connection
      - IMMICH_URL=http://immich-server:2283
      - IMMICH_EXTERNAL_URL=https://photos.example.com # Optional: Public URL for browser links
      - IMMICH_ACCOUNTS=alice:your_immich_api_key_here

      # Optional: Skip TLS verification for self-signed certificates
      # - IMMICH_INSECURE_SKIP_VERIFY=true

      # Defaults
      - PLAYGROUND_SAMPLE_SIZE=24
      - PLAYGROUND_SEARCH_MODE=random
      - PLAYGROUND_INCLUDE_VIDEOS=true
      - PLAYGROUND_INCLUDE_ARCHIVED=false

    # Optional: mount local config.yaml and persistent profiles
    # volumes:
    #   - ./config.yaml:/app/config.yaml:ro
    #   - ./profiles.json:/app/profiles.json
